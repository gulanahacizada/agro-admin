<div class="panel">
  <div class="panel-header p-20">
    <h1 class="panel-title bold">
      <i aria-hidden="true" class="icon-newspaper-3 mr-10"></i>
      Haqqımızda
    </h1>
  </div>
  <div class="panel-body p-20 pt-10 pb-10 bg-gray">
    <div class="row as-5">
      <div class="col xl-3 lg-4 md-4 sm-7 xs-7 ml-auto">
      </div>
      <div class="col xl-1 lg-2 md-2 sm-3 xs-3">
        <a [routerLink]="['add']" class="btn bg-orange w-100p shadow border-0">
          <i aria-hidden="true" class="icon-plus mr-10"></i>
          Yeni
        </a>
      </div>
    </div>
  </div>
  <div class="panel-body table-responsive m-0 p-0 border-0 o-auto">
    <table class="table bordered hovered">
      <thead class="no-wrap">
        <tr>
          <th>№</th>
          <th>Başlıq</th>
          <th colspan="2">Əməliyyatlar</th>
        </tr>
      </thead>
      <tbody class="text-center">
        <tr *ngFor="let about of aboutList; let i=index">
          <td>{{i+1}}</td>
          <td>
            <span class="line-clamp line-1 text-left"> {{about?.title}} </span>
          </td>
          <td>
            <a [routerLink]="['details', about?.id ]" aria-label="Bax" title="Bax" data-toggle="tooltip"
              class="btn xs circle bg-white shadow border-0">
              <i aria-hidden="true" class="icon-eye v-align-middle"></i>
            </a>
          </td>
          <td class="no-wrap">
            <a [routerLink]="['edit', about?.id ]" aria-label="Redaktə et" title="Redaktə et" data-toggle="tooltip"
              class="btn xs circle bg-blue dark shadow border-0">
              <i aria-hidden="true" class="icon-pen-5 v-align-middle"></i>
            </a>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
