<form  [formGroup]="loginForm" (ngSubmit)="login()">
        <h1>Login</h1>
        <div class="clear mb-15">
            <label>UserName</label>
            <input formControlName='username' class="input" type="text" placeholder="UserName">
        </div>
        <div class="clear mb-15">
            <label>Password</label>
            <input formControlName='password' class="input" type="password" placeholder="Password">
        </div>
        <button [disabled]="!loginForm.valid" class="btn bg-green shadow border-0 float-right" >Submit</button>
</form>
