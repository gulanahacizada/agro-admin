<div class="panel">

  <div class="panel-header p-20">
    <h1 class="panel-title bold">
      <i aria-hidden="true" class="icon-newspaper-3 mr-10"></i>
      Xəbərlər
    </h1>
  </div>

  <div class="panel-body p-20 pt-10 pb-10 bg-gray">
    <div class="row as-5">
      <div class="col xl-3 lg-4 md-4 sm-7 xs-7 ml-auto">
        <div class="input-group shadow">

          <input [(ngModel)]="serchValue" type="search" class="input border-0 radius-0" placeholder="Axtar...">
          <button (click)="filterNew()" class="btn bg-white border-0 radius-0" aria-label="Axtar">
            <i aria-hidden="true" class="icon-search v-align-middle"></i>
          </button>
        </div>

      </div>
      <div class="col xl-1 lg-2 md-2 sm-3 xs-3">
        <a (click)="resetSerch()" class="btn bg-orange w-100p shadow border-0">
          Reset
        </a>
      </div>
      <div class="col xl-1 lg-2 md-2 sm-3 xs-3">
        <a [routerLink]="['add']" class="btn bg-orange w-100p shadow border-0">
          <i aria-hidden="true" class="icon-plus mr-10"></i>
          Yeni
        </a>
      </div>

    </div>
  </div>

  <div class="panel-body table-responsive m-0 p-0 border-0 o-auto">
    <table class="table bordered hovered">
      <thead class="no-wrap">
        <tr>
          <th>№</th>
          <th>Başlıq</th>
          <th>Tarix</th>
          <th>Baxış sayı</th>

          <th colspan="2">Əməliyyatlar</th>
        </tr>
      </thead>
      <tbody class="text-center">
        <tr *ngFor="let new of newsList; let i=index">
          <td>{{i+1}}</td>
          <td>
            <span class="line-clamp line-1 text-left"> {{new?.title}} </span>
          </td>
          <td> {{new?.created_at | date: 'dd/MM/yyyy'}} </td>
          <td> {{new?.views}} </td>


          <td>
            <a aria-label="Bax" title="Bax" data-toggle="tooltip" class="btn xs circle bg-white shadow border-0">
              <i aria-hidden="true" class="icon-eye v-align-middle"></i>
            </a>
          </td>
          <td class="no-wrap">
            <a [routerLink]="['edit', new?.id ]" aria-label="Redaktə et" title="Redaktə et" data-toggle="tooltip"
              class="btn xs circle bg-blue dark shadow border-0">
              <i aria-hidden="true" class="icon-pen-5 v-align-middle"></i>
            </a>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="panel-footer">
    <p-paginator *ngIf="newsList?.length" [rows]="pagination?.per_page" [totalRecords]="pagination?.total"
      (onPageChange)="paginate($event)"></p-paginator>
  </div>

</div>
