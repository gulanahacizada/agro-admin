<div class="row as-7">
  <div class="col as-12 xl-7">
    <div class="panel h-100p">
      <div class="panel-header p-20">
        <h1 class="panel-title bold">
          <i aria-hidden="true" class="icon-sort-three-line mr-10"></i>
          Kateqoriyalar
        </h1>
      </div>
      <div class="panel-body p-20">
        <div class="dd nestable3">
          <ol class="dd-list">
            <li *ngFor="let category of categoryList" class="box box-solid dd-item dd3-item collapsed-box">
              <div class="dd-handle dd3-handle">
                <i aria-hidden="true" class="icon-plus"></i>
              </div>
              <div class="box-tools dd3-content clearfix">
                <span> {{category?.name}} </span>
                <a class="float-right"><i aria-hidden="true" class="icon-trash"></i></a>
              </div>
              <ol class="dd-list">
                <li *ngFor="let sub of category.sub_categories" class="box box-solid dd-item dd3-item collapsed-box">
                  <div class="box-tools dd3-content clearfix">
                    <span> {{sub?.name}} </span>
                    <a class="float-right"><i aria-hidden="true" class="icon-settings"></i></a>
                  </div>
                </li>
              </ol>
            </li>
          </ol>
        </div>
      </div>
    </div>
  </div>
  <div class="col as-12 mb-10 hide-xl"></div>
  <div class="col as-12 xl-5">
    <div class="panel h-100p">
      <div class="panel-header p-20">
        <h2 class="panel-title bold float-left">Əlavə et</h2>
      </div>
      <form [formGroup]="categoryAddForm" (ngSubmit)="onSubmit()">
        <div class="panel-body">
          <div class="row as-7 mb-15">
            <div class="col as-6 xs-12 p-5">
              <div class="ckbox">
                <input (input)="OnSelect()" type="radio" class="ckbox" id="category" name="category" checked="">
                <label for="category">Kateqoriya</label>
              </div>
            </div>
            <div class="col as-6 xs-12 p-5">
              <div class="ckbox">
                <input type="radio" (input)="OnSelect()" class="ckbox" id="sub-category" name="category">
                <label for="sub-category">Alt kateqoriya</label>
              </div>
            </div>
          </div>
          <div class="clear mb-15">
            <label>Kateqoriya adı AZ</label>
            <input formControlName="name_az" class="input" type="text" placeholder="Kateqoriya adını yazın">
          </div>
          <div class="clear mb-15">
            <label>Kateqoriya adı RU</label>
            <input formControlName="name_ru" class="input" type="text" placeholder="Kateqoriya adını yazın">
          </div>
          <div class="clear mb-15">
            <label>Kateqoriya adı EN</label>
            <input formControlName="name_en" class="input" type="text" placeholder="Kateqoriya adını yazın">
          </div>
          <div *ngIf="show" class="clear">
            <label>Ana kateqoriya</label>
            <p-dropdown formControlName="parent_id" placeholder="Ana kateqoriya seçin" filter="true"
              [options]="selectCategoryList" class="input select custom"></p-dropdown>
          </div>
        </div>
        <div class="panel-footer">
          <button type="submit" [disabled]="!categoryAddForm.valid" class="btn bg-green shadow border-0 float-right"
            title="Yadda saxla">
            Yadda saxla
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
