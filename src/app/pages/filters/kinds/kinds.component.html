<div class="row as-7">
  <div class="col as-12 xl-7">
    <div class="panel h-100p">
      <div class="panel-header p-20">
        <h1 class="panel-title bold">
          <i aria-hidden="true" class="icon-sort-three-line mr-10"></i>
          Növlər
        </h1>
      </div>
      <div class="panel-body p-20">
        <div class="dd nestable3">
          <ol class="dd-list">
            <li *ngFor="let kind of kinds" class="box box-solid dd-item dd3-item collapsed-box">
              <div class="box-tools dd3-content clearfix">
                <span> {{kind?.name}} </span>
                <a (click)="getKindById(kind?.id)" class="float-right">
                    <i aria-hidden="true" class="icon-pen-5"></i>
                </a>
              </div>
            </li>
          </ol>
        </div>
      </div>
    </div>
  </div>
  <div class="col as-12 mb-10 hide-xl"></div>
  <div class="col as-12 xl-5">
    <div class="panel h-100p">
      <div class="panel-header p-20">
        <h2 class="panel-title bold float-left">Əlavə et</h2>
      </div>
      <form [formGroup]="addKindForm" (ngSubmit)="onSubmit()">
        <div class="panel-body">
          <div class="row as-7 mb-15">
          </div>
          <div class="clear mb-15">
            <label>Azərbaycan Dili</label>
            <input formControlName='name_az' class="input" type="text" placeholder="Növ adını yazın">
          </div>
          <div class="clear mb-15">
            <label>Rus Dili</label>
            <input formControlName='name_ru' class="input" type="text" placeholder="Növ adını yazın">
          </div>
          <div class="clear mb-15">
            <label>İngilis Dili</label>
            <input formControlName='name_en' class="input" type="text" placeholder="Növ adını yazın">
          </div>
          <div class="clear mb-15">
            <label>Ana kateqoriya</label>
            <p-dropdown *ngIf="!edit" placeholder="Ana kateqoriya seçin"  filter="true" [options]="selectCategoryList"
              (onChange)="onSelectCategory($event)" formControlName="parentId" class="input select custom">
            </p-dropdown>
            <p-dropdown *ngIf="edit" placeholder="{{kindDetail?.parent_catregory?.name}}"  filter="true" [options]="selectCategoryList"
            (onChange)="onSelectCategory($event)" formControlName="parentId" class="input select custom">
          </p-dropdown>
          </div>
          <div class="clear">
            <label>Alt kateqoriya</label>
            <p-dropdown placeholder="Alt kateqoriya seçin" filter="true" formControlName='category_id'
              [options]="subCategoryList" class="input select custom">
            </p-dropdown>
          </div>
        </div>
        <div class="panel-footer">
          <button (click)="deleteKind()" *ngIf="kindDetail?.id" type="button"  class="btn bg-red border-0 shadow" title="Sil">
            <i aria-hidden="true" class="icon-trash mr-10"></i>
            Sil
          </button>
          <button (click)="reset()" *ngIf="kindDetail?.id" type="button"  class="btn bg-white  border-0 shadow" title="Sil" >
            <i aria-hidden="true" class="icon-trash mr-10"></i>
            Reset
          </button>
          <button type="submit" [disabled]='!addKindForm.valid' class="btn bg-green shadow border-0 float-right"
            title="Yadda saxla">
            Yadda saxla
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
