<div class="panel mb-15">
  <div class="panel-header p-20 pt-15 pb-15">
      <h1 class="panel-title bold float-left">
          <i aria-hidden="true" class="icon-envelope mr-10"></i>
          Müraciətə ətraflı baxış
      </h1>
  </div>

  <div class="panel-body p-20">

      <div class="row border-bottom pb-5">
          <div class="col as-3 xs-5 bold pb-5 no-wrap pr-15">
              Göndərən:
          </div>
          <div class="col as-9 xs-7 pb-5">
              <span class="bold" title="Balayev Kamal Mirzə"> {{offerInfo?.name}} </span>
          </div>
      </div>
      <div class="row border-bottom pt-10 pb-5">
        <div class="col as-3 xs-5 bold pb-5 no-wrap pr-15">
            Email:
        </div>
        <div class="col as-9 xs-7 pb-5">
            <a rel="external" >{{offerInfo?.email}}</a>
        </div>
    </div>
      <div class="row border-bottom pt-10 pb-5">
          <div class="col as-3 xs-5 bold pb-5 no-wrap pr-15">
              Müraciət tarixi:
          </div>
          <div class="col as-9 xs-7 pb-5"> {{offerInfo?.created_at | date: 'dd/MM/yyyy'}} </div>
      </div>
      <div class="row border-bottom pt-10 pb-5">
        <div class="col as-3 xs-5 bold pb-5 no-wrap pr-15">
            Müraciət mesajı:
        </div>
        <div class="col as-9 xs-7 pb-5">
           {{offerInfo?.body}}
        </div>
    </div>

  </div>

  <div class="panel-footer">
      <button class="btn bg-red border-0 shadow float-right" title="İmtina et" data-target-modal="alert-modal">
          Sil
      </button>
  </div>

</div>
